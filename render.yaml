services:
  - type: web
    name: cham-cong-quan
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: CAFE_WIFI_NAME
        value: The -Cha
      - key: CAFE_ALLOWED_IP_PREFIXES
        value: 14.241.72.12,192.168.1.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_KEY
        value: cham-cong-quan
